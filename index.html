/* 版面概念：方格簿（亮）／黑板（暗）上的闖關地圖；五個單元是五種顏色的關卡卡片，題目卡像作業本的一頁 */
:root{
  --paper:#edf4f2; --grid:rgba(38,98,118,.085); --ink:#1b2a36; --muted:#56687a; --card:#ffffff; --soft:#f3f8f7; --line:#c9d9dd;
  --accent:#ef6a1c; --on-accent:#ffffff; --sun:#ffc43d; --on-sun:#2a2108;
  --good:#18915a; --good-bg:#e1f5e9; --bad:#d43f48; --bad-bg:#fde7e7;
  --u1:#2a7fd0; --u2:#e8681a; --u3:#1b9157; --u4:#c13a84; --u5:#6352cf;
  --wedge:rgba(239,106,28,.22); --ruler:#fbefb4; --bar:#ef6a1c;
  --f-display:"Baloo 2","BpmfKai","BiauKai","DFKai-SB","Noto Sans TC",serif;
  --f-body:"Baloo 2","BpmfKai","BiauKai","DFKai-SB","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Baloo 2","BpmfKai","Noto Sans TC",ui-rounded,system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#13232a; --grid:rgba(214,255,238,.05); --ink:#ebf3ef; --muted:#9fb3b6; --card:#1c3038; --soft:#18292f; --line:#2d4750;
  --accent:#ff8a3e; --on-accent:#1e1006; --sun:#ffd166; --on-sun:#2a2108;
  --good:#4ccb87; --good-bg:#153728; --bad:#ff6c74; --bad-bg:#3c1e23;
  --u1:#5ea9f0; --u2:#ff9150; --u3:#4ccb87; --u4:#ee70b5; --u5:#9d8fff;
  --wedge:rgba(255,138,62,.28); --ruler:#4a4321; --bar:#ff8a3e; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#13232a; --grid:rgba(214,255,238,.05); --ink:#ebf3ef; --muted:#9fb3b6; --card:#1c3038; --soft:#18292f; --line:#2d4750;
  --accent:#ff8a3e; --on-accent:#1e1006; --sun:#ffd166; --on-sun:#2a2108;
  --good:#4ccb87; --good-bg:#153728; --bad:#ff6c74; --bad-bg:#3c1e23;
  --u1:#5ea9f0; --u2:#ff9150; --u3:#4ccb87; --u4:#ee70b5; --u5:#9d8fff;
  --wedge:rgba(255,138,62,.28); --ruler:#4a4321; --bar:#ff8a3e; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:19px;line-height:1.75;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1060px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
.num{font-family:var(--f-num)}

/* ---------- 首頁 ---------- */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:22px}
.brand small{display:block;font-size:14px;color:var(--muted);letter-spacing:.12em}
.brand h1{font-size:clamp(34px,6vw,54px);font-weight:700}
.brand h1 em{font-style:normal;color:var(--accent)}
.brand p{margin:6px 0 0;color:var(--muted)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700}
.pill .num{font-size:20px;line-height:1}
.starc{color:var(--sun);font-size:20px;line-height:1;-webkit-text-stroke:1px rgba(0,0,0,.15)}
.iconbtn{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-size:15px}
.hero-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:26px}
.bigbtn{display:flex;align-items:center;gap:14px;text-align:left;border:none;border-radius:var(--r);padding:16px 18px;background:var(--accent);color:var(--on-accent);box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .12s}
.bigbtn:hover{transform:translateY(-2px)}
.bigbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.bigbtn b{font-family:var(--f-display);font-size:24px;display:block;line-height:1.2}
.bigbtn span{font-size:14px;opacity:.9}
.bigbtn .ico{font-family:var(--f-num);font-size:30px;font-weight:800;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22);flex:none}
.bigbtn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.bigbtn.alt .ico{background:var(--bad-bg);color:var(--bad)}
.bigbtn[disabled]{opacity:.5;cursor:not-allowed;transform:none}

.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.unit{background:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.unit header{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--uc);color:#fff}
:root[data-theme="dark"] .unit header{color:#0f1b20}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .unit header{color:#0f1b20}}
.unum{font-family:var(--f-num);font-weight:800;font-size:46px;line-height:.9;width:54px;height:54px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.22);flex:none}
.unit header small{display:block;font-size:13px;opacity:.9;letter-spacing:.1em}
.unit header h2{font-size:23px}
.secs{display:flex;flex-direction:column;gap:8px;padding:14px}
.sec{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;background:var(--soft);border:2px solid transparent;border-radius:12px;padding:9px 12px;text-align:left;transition:border-color .12s,transform .12s}
.sec:hover{border-color:var(--uc);transform:translateX(3px)}
.sec .code{font-family:var(--f-num);font-weight:800;color:var(--uc);font-size:18px;min-width:34px}
.sec .nm{font-weight:500}
.stars{font-size:17px;letter-spacing:1px;color:var(--line);white-space:nowrap}
.stars i{font-style:normal}
.stars i.on{color:var(--sun);-webkit-text-stroke:1px rgba(0,0,0,.12)}
.uchal{margin:0 14px 14px;border:2px dashed var(--uc);background:transparent;border-radius:12px;padding:9px;font-weight:700;color:var(--uc);display:flex;justify-content:center;gap:8px}
.uchal:hover{background:var(--soft)}
.uchal small{font-weight:400;color:var(--muted)}
.note{font-size:13px;margin-left:auto;background:rgba(255,255,255,.25);padding:2px 10px;border-radius:99px;white-space:nowrap}
.foot{margin-top:28px;color:var(--muted);font-size:14px;text-align:center}

/* ---------- 重點小卡 ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,25,.45);display:grid;place-items:center;z-index:30;padding:16px}
.sheet{background:var(--card);border-radius:20px;max-width:480px;width:100%;padding:22px;border-top:10px solid var(--uc);box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.sheet .code{font-family:var(--f-num);font-weight:800;color:var(--uc);font-size:20px}
.sheet h3{font-size:28px;margin-bottom:10px}
.sheet h4{margin:12px 0 6px;font-size:14px;letter-spacing:.12em;color:var(--muted)}
.sheet ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.sheet .row{display:flex;gap:10px;margin-top:20px}
.btn{border:none;border-radius:12px;padding:12px 18px;font-weight:700;font-size:17px;background:var(--soft);border:2px solid var(--line)}
.btn.go{background:var(--accent);color:var(--on-accent);border-color:transparent;flex:1;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn.go:active{transform:translateY(2px);box-shadow:none}

/* ---------- 闖關 ---------- */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.qtop h2{font-size:22px;flex:1 1 auto;min-width:8em}
.qtop h2 .code{font-family:var(--f-num);color:var(--uc)}
.dots{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.dots i{flex:1;height:10px;border-radius:99px;background:var(--line);min-width:14px}
.dots i.ok{background:var(--good)}
.dots i.no{background:var(--bad)}
.dots i.cur{background:var(--uc);box-shadow:0 0 0 3px color-mix(in srgb,var(--uc) 30%,transparent)}
.combo{font-family:var(--f-num);font-weight:800;background:var(--sun);color:var(--on-sun);border-radius:99px;padding:2px 12px;font-size:16px}
.combo[hidden]{display:none}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px clamp(16px,4vw,32px);position:relative;max-width:760px;margin:0 auto}
.qno{font-size:14px;color:var(--muted);letter-spacing:.1em;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.qtext .visual{font-size:16px}
.qtext{font-size:clamp(19px,3.4vw,23px);line-height:1.75}
.qtext b{color:var(--accent)}
.formula{font-family:var(--f-num);font-size:clamp(26px,5.5vw,36px);font-weight:600;margin:10px 0;letter-spacing:.02em}
.ansline{margin-top:10px;font-weight:500}
.visual{margin:14px 0 4px;overflow-x:auto}
.visual svg{max-width:100%;height:auto;display:block}
.blank{width:4.2em;font-family:var(--f-num);font-size:1.15em;font-weight:600;text-align:center;border:none;border-bottom:3px solid var(--uc);background:var(--soft);color:var(--ink);border-radius:8px 8px 0 0;padding:2px 4px;margin:0 4px;vertical-align:baseline}
.blank.act{background:color-mix(in srgb,var(--sun) 35%,var(--card));border-bottom-color:var(--accent)}

.seq{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-family:var(--f-num);font-size:clamp(20px,4vw,26px);margin-top:8px}

.cmpline{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;font-family:var(--f-num);font-size:clamp(24px,5vw,34px);font-weight:600;margin:14px 0}

.bignum{font-family:var(--f-num);font-size:52px;font-weight:800;letter-spacing:.12em;line-height:1.2}
.hl{color:var(--bad);text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
.cards{display:inline-flex;gap:6px;vertical-align:middle}
.cards i{font-style:normal;font-family:var(--f-num);font-weight:800;width:1.6em;height:2em;display:grid;place-items:center;border:2px solid var(--ink);border-radius:6px;background:var(--soft)}
.tbl{display:grid;grid-template-columns:auto auto;gap:4px 18px;justify-content:start;margin:10px 0;font-size:.95em}
.tbl b{font-family:var(--f-num);color:var(--ink)}
.moneyrow{display:flex;flex-wrap:wrap;gap:12px 18px}
.mg{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-num);font-size:20px}
.money{width:70px;height:auto}
.money.coin{width:42px}.money.coin.s{width:36px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:18px}
.opts.sym,.opts.num{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.opt{background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:19px;font-weight:500;text-align:center;transition:transform .1s,border-color .1s;min-height:56px}
.opts.sym .opt,.opts.num .opt{font-family:var(--f-num);font-size:26px;font-weight:700}
.opts.sym .opt{font-family:var(--f-body);font-size:21px}
.opt:hover:not([disabled]){border-color:var(--uc);transform:translateY(-2px)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-bg);color:var(--ink)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.55}
.opts.shape .opt{padding:8px}
.mini{width:84px;height:84px;display:block;margin:0 auto}
.angrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.angrow.four{display:grid;grid-template-columns:repeat(4,1fr)}

.angrow.four figure{min-width:0;max-width:none}

.angrow figure{margin:0;flex:1;min-width:130px;max-width:230px;background:var(--soft);border-radius:14px;padding:6px}
.angrow figcaption{text-align:center;font-family:var(--f-num);font-weight:800;font-size:20px}
.visual > .ang{max-width:230px;margin:0 auto;background:var(--soft);border-radius:14px}
.ray{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.wedge{fill:var(--wedge)}
.vx{fill:var(--ink)}
.poly{fill:color-mix(in srgb,var(--uc) 16%,transparent);stroke:var(--ink);stroke-width:4;stroke-linejoin:round}
.nlx,.nlt{stroke:var(--ink);stroke-width:3}
.nla{fill:var(--ink)}
.nln{fill:var(--ink);font-family:var(--f-num);font-size:22px;font-weight:600}
.nln.sm{font-size:19px}
.qbox{fill:var(--sun)}
.qtxt{fill:var(--on-sun);font-family:var(--f-num);font-weight:800;font-size:24px}
.bug{fill:var(--accent)}
.bugt{fill:var(--on-accent);font-size:13px;font-weight:700}
.bugp{fill:var(--accent)}
.ruler{min-width:300px;width:100%}
.rbody{fill:var(--ruler);stroke:var(--line);stroke-width:2}
.rt{stroke:var(--ink);stroke-width:1.4}
.rn{fill:var(--ink);font-family:var(--f-num);font-size:15px;font-weight:600}
.ru{fill:var(--muted);font-size:11px}
.bar{fill:var(--bar)}
.guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}

.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px auto 0;max-width:440px}
.keypad button{border:2px solid var(--line);background:var(--soft);border-radius:12px;padding:8px 0;font-family:var(--f-num);font-size:26px;font-weight:700;min-height:54px}
.keypad button:active{transform:translateY(2px)}
.keypad .fn{font-family:var(--f-body);font-size:17px;background:var(--card)}
.keypad .send{grid-row:span 2;background:var(--accent);color:var(--on-accent);border-color:transparent;font-family:var(--f-body);font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.keypad .zero{grid-column:span 3}
.hint{color:var(--bad);font-weight:700;min-height:1.4em;margin-top:6px;font-size:15px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.fb{margin-top:18px;border-radius:16px;padding:16px 18px;border:2px solid}
.fb.ok{background:var(--good-bg);border-color:var(--good)}
.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{font-size:26px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fb.ok h3{color:var(--good)}.fb.no h3{color:var(--bad)}
.fb .right{font-family:var(--f-body);font-size:17px;color:var(--ink);font-weight:500}

.explain{margin-top:8px;font-size:16.5px;line-height:1.8}

details.explain summary{cursor:pointer;color:var(--muted);font-weight:500}
.steps{margin:8px 0 0;padding-left:1.3em;font-size:15.5px;color:var(--ink)}
.vert{display:inline-flex;flex-direction:column;align-items:flex-end;font-family:var(--f-num);font-size:24px;font-weight:600;background:var(--card);border-radius:10px;padding:6px 14px;margin:8px 0;line-height:1.35}
.vr{display:grid;grid-template-columns:repeat(var(--w),1.05em);text-align:center}
.vr.line{border-top:3px solid var(--ink);margin-top:2px;padding-top:2px}
.next{margin-top:14px;width:100%}

/* ---------- 結果 ---------- */
.result{text-align:center;max-width:560px;margin:20px auto;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:28px 20px;border-top:12px solid var(--uc)}
.result h2{font-size:34px}
.bigstars{font-size:64px;letter-spacing:8px;margin:8px 0;line-height:1.1}
.bigstars i{font-style:normal;color:var(--line);display:inline-block}
.bigstars i.on{color:var(--sun);-webkit-text-stroke:2px rgba(0,0,0,.15);animation:pop .5s backwards}
.bigstars i:nth-child(2){animation-delay:.15s}.bigstars i:nth-child(3){animation-delay:.3s}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.score{font-family:var(--f-num);font-size:48px;font-weight:800;line-height:1}
.score small{font-size:22px;color:var(--muted)}
.result p{color:var(--muted)}
.result .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.result .row .btn{flex:1;min-width:140px}


/* ---------- 新增：題型 ---------- */
.small{font-size:15px;color:var(--muted);margin-top:4px}
.cards.wide i{width:auto;padding:0 .45em}
.cards.wide{display:flex;flex-wrap:wrap;margin:10px 0}
.chip{font-style:normal;font-size:12px;font-weight:700;letter-spacing:.06em;padding:1px 9px;border-radius:99px;background:var(--soft);border:1.5px solid var(--line);margin-left:6px;color:var(--muted)}

.pt{fill:var(--accent);stroke:var(--card);stroke-width:2}

.ray.r1,.ptl.c1,.arcl.r1{stroke:var(--u4)}.ptl.c1{fill:var(--u4)}
.ray.r2,.ptl.c2,.arcl.r2{stroke:var(--u1)}.ptl.c2{fill:var(--u1)}

.ray.dash{stroke-dasharray:8 6}

.ang.over{max-width:320px;margin:6px auto;display:block}

.ang.tb{border-radius:10px;border:1.5px solid var(--gl)}
.gbg{fill:var(--gbg)}.gl{stroke:var(--gl);stroke-width:1}
.kr{stroke-width:3.2;stroke-linecap:round}.kr.dash{stroke-dasharray:7 6;stroke-width:3.2}
.k1{stroke:var(--k1)}.k2{stroke:var(--k2)}.k3{stroke:var(--k3)}
.arck{fill:none;stroke-width:2}
.kn{stroke:none;font-family:var(--f-num);font-weight:800;font-size:21px}

.kn.k1{fill:var(--k1)}.kn.k2{fill:var(--k2)}.kn.k3{fill:var(--k3)}
.angrow figure{background:transparent;padding:0}
.trace{margin-top:12px;background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:8px 12px}

/* ---------- 代幣 ---------- */
.coin-i{width:22px;height:22px;flex:none;vertical-align:-5px}
.pill.sm{padding:3px 10px}.pill.sm .num{font-size:17px}
.dim{color:var(--muted);font-weight:500}
.hero-actions{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

.bigbtn.gacha .ico{background:color-mix(in srgb,var(--sun) 40%,transparent)}

.bigbtn.wrongb .ico{background:var(--bad-bg);color:var(--bad)}
.gain{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-family:var(--f-num);font-size:20px;color:var(--ink);background:color-mix(in srgb,var(--sun) 45%,transparent);border-radius:99px;padding:0 12px;animation:pop .45s}

.btn.gacha-go{background:var(--sun);color:var(--on-sun);border-color:transparent}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--sun);border-radius:16px;padding:10px 18px 10px 10px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);animation:tin .35s}

.toast .tb{width:44px;flex:none}.toast b{display:block}.toast span{font-size:14px;color:var(--muted)}

/* ---------- 扭蛋機 ---------- */
.mtabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.mtab{flex:1;min-width:110px;display:flex;flex-direction:column;align-items:flex-start;gap:0;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 12px;text-align:left;position:relative}

.gstage{display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:24px;align-items:start;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px}
@media (max-width:640px){.gstage{grid-template-columns:1fr}.gmach{max-width:240px;margin:0 auto}}
.gmach{position:relative}

.gmach.locked .machine{filter:grayscale(1);opacity:.45}
.lock{position:absolute;inset:auto 0 30% 0;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px;font-size:14px;margin:0 12px}
.gmach.turning .knob{animation:knob 1.1s ease-in-out;transform-origin:65px 134px}
.gmach.turning .machine{animation:shake2 1.2s}
@keyframes knob{to{transform:rotate(720deg)}}
@keyframes shake2{10%,50%,90%{transform:translateX(-4px) rotate(-1deg)}30%,70%{transform:translateX(4px) rotate(1deg)}}
.ginfo h3{font-size:28px}

.gpool{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
@media (max-width:480px){.gpool{grid-template-columns:repeat(3,1fr)}}
.gp{background:var(--soft);border-radius:12px;padding:6px 4px;text-align:center;border:2px solid transparent;display:flex;flex-direction:column;align-items:center}

.rR{border-color:#5aa8ef!important}.rSR{border-color:#f2b705!important}.rSP{border-color:#d6455a!important}
.spin{width:100%;font-size:20px;padding:14px}

.fig.sil *{fill:var(--line)!important;stroke:var(--line)!important}

.reveal.rSR{background:linear-gradient(160deg,color-mix(in srgb,#ffd23f 30%,var(--card)),var(--card) 60%)}
.reveal.rR{background:linear-gradient(160deg,color-mix(in srgb,#5aa8ef 25%,var(--card)),var(--card) 60%)}
.capsule{position:absolute;left:50%;top:70px;width:90px;height:90px;margin-left:-45px;pointer-events:none}
.capsule span{position:absolute;left:0;width:90px;height:45px;border:3px solid #2b2a33}
.ctop{top:0;border-radius:45px 45px 0 0;background:var(--uc,#ff6b6b);animation:ctop .7s .2s forwards}

@keyframes ctop{to{transform:translate(-60px,-80px) rotate(-40deg);opacity:0}}
@keyframes cbot{to{transform:translate(60px,90px) rotate(30deg);opacity:0}}
.rfig .fig{width:170px;height:auto;animation:figin .6s .55s backwards}
@keyframes figin{from{transform:scale(.2);opacity:0}70%{transform:scale(1.1)}}
.rar{font-style:normal;font-weight:800;letter-spacing:.15em;font-size:13px;color:var(--muted)}
.reveal.rSR .rar{color:#c98a00}.reveal.rR .rar{color:#2a7fd0}
.rtxt h3{font-size:30px}

.newf{color:var(--good);font-weight:800}.dup{color:var(--muted);font-weight:700}
.reveal .row{display:flex;gap:10px;margin-top:14px}.reveal .row .btn{flex:1}

/* ---------- 收藏冊 ---------- */
.ctabs{display:flex;gap:8px;margin-bottom:18px}

.qtext.sm{font-size:19px}

<script>
/* ===== 題目產生器：三上數學 第 1 單元 ～ 5-2 ===== */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const ZH='零一二三四五六七八九';
const PL=['個位','十位','百位','千位','萬位'];
function zh(n){
  if(n===10000)return '一萬'; if(n===0)return '零';
  const s=String(n),U=['千','百','十',''].slice(4-s.length);let out='',z=false;
  for(let i=0;i<s.length;i++){const d=+s[i];
    if(d===0){if(out)z=true;continue;}
    if(z){out+='零';z=false;}
    if(!(s.length===2&&i===0&&d===1))out+=ZH[d];
    out+=U[i];}
  return out;
}
/* 題目建構 */
function F(html,ans,explain,visual){return{kind:'fill',html,ans:(Array.isArray(ans)?ans:[ans]).map(Number),explain,visual:visual||''};}
function C(html,correct,wrongs,explain,visual,cls){
  correct=String(correct);
  const w=[...new Set(wrongs.map(String))].filter(x=>x!==correct).slice(0,3);
  const opts=shuffle([correct,...w]);
  return{kind:'choice',html,opts,ans:opts.indexOf(correct),explain,visual:visual||'',cls:cls||''};
}
function CF(html,opts,ans,explain,visual,cls){return{kind:'choice',html,opts,ans,explain,visual:visual||'',cls:cls||''};}
function CMP(lh,rh,lv,rv,explain){
  const sym=lv>rv?'＞':lv<rv?'＜':'＝';
  return CF(`在 □ 裡填入＞、＜或＝。<div class="cmpline"><span>${lh}</span><span class="box">□</span><span>${rh}</span></div>`,['＞','＜','＝'],['＞','＜','＝'].indexOf(sym),explain,'','sym');
}
const eq=s=>`<div class="formula">${s}</div>`;
const ansLine=u=>`<div class="ansline">答：{0} ${u}</div>`;

/* 直式 */
function vert(top,bottom,op,res){
  const rows=[String(top),op+String(bottom),String(res)];
  const w=Math.max(...rows.map(r=>r.length));
  const row=(s,c)=>`<div class="vr${c?' '+c:''}" style="--w:${w}">${s.padStart(w,' ').split('').map(ch=>`<span>${ch===' '?'':ch}</span>`).join('')}</div>`;
  return `<div class="vert">${row(rows[0])}${row(rows[1])}${row(rows[2],'line')}</div>`;
}
function addSteps(a,b){
  const A=String(a).split('').reverse(),B=String(b).split('').reverse();let c=0;const L=[];
  for(let i=0;i<Math.max(A.length,B.length);i++){
    const da=+(A[i]||0),hasB=B[i]!==undefined,db=+(B[i]||0),s=da+db+c;
    let t=`${PL[i]}：`+(A[i]!==undefined&&hasB?`${da}＋${db}`:A[i]!==undefined?`${da}`:`${db}`);
    t+=c?'＋1（進位）':'';t+=`＝${s}`;
    t+=s>=10?`，寫 ${s%10}，進 1 到${PL[i+1]}`:'';
    c=s>=10?1:0;L.push(t);
  }
  if(c)L.push(`${PL[Math.max(A.length,B.length)]}：寫進位的 1`);
  return L;
}
function subSteps(a,b){
  const A=String(a).split('').reverse(),B=String(b).split('').reverse();let br=0;const L=[];
  for(let i=0;i<A.length;i++){
    const da=+A[i],hasB=B[i]!==undefined,db=hasB?+B[i]:0,have=da-br;let t;
    if(have<db){
      const v=have+10;
      if(have<0)t=`${PL[i]}：原本是 0，先向${PL[i+1]}借 1 當 10，再借 1 給${PL[i-1]}，剩 9；9−${db}＝${9-db}`;
      else if(br)t=`${PL[i]}：${da} 借出 1 後剩 ${have}，不夠減 ${db}，向${PL[i+1]}借 1，變成 ${v}；${v}−${db}＝${v-db}`;
      else t=`${PL[i]}：${da} 不夠減 ${db}，向${PL[i+1]}借 1，變成 ${v}；${v}−${db}＝${v-db}`;
      br=1;
    }else{
      const r=have-db;
      t=`${PL[i]}：`+(br?`${da} 借出 1 後剩 ${have}，`:'')+(hasB?`${have}−${db}＝${r}`:`寫 ${have}`);
      if(i===A.length-1&&r===0&&hasB)t+='（最高位是 0，不用寫）';
      br=0;
    }
    L.push(t);
  }
  return L;
}
function mulSteps(a,n){
  const A=String(a).split('').reverse();let c=0;const L=[];
  A.forEach((ch,i)=>{const d=+ch,p=d*n+c,last=i===A.length-1;
    let t=`${PL[i]}：${d}×${n}＝${d*n}`+(c?`，加進位的 ${c} 是 ${p}`:'');
    t+=last?`，寫 ${p}`:(p>=10?`，寫 ${p%10}，進 ${Math.floor(p/10)}`:`，寫 ${p}`);
    c=Math.floor(p/10);L.push(t);});
  return L;
}
const steps=L=>`<ol class="steps">${L.map(x=>`<li>${x}</li>`).join('')}</ol>`;
const carries=(a,b)=>{let c=0,n=0;while(a||b){const s=a%10+b%10+c;c=s>=10?1:0;n+=c;a=Math.floor(a/10);b=Math.floor(b/10);}return n;};
const borrows=(a,b)=>{let br=0,n=0;while(a){const d=a%10-br,e=b%10;br=d<e?1:0;n+=br;a=Math.floor(a/10);b=Math.floor(b/10);}return n;};

/* ===== 圖示 ===== */
const MONEY={
  1000:'<svg viewBox="0 0 64 34" class="money"><rect x="1" y="1" width="62" height="32" rx="4" fill="#cfe3f7" stroke="#3f74ad" stroke-width="2"/><circle cx="10" cy="17" r="5" fill="#9cc3ea"/><text x="37" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#1f4d80">1000</text></svg>',
  100:'<svg viewBox="0 0 64 34" class="money"><rect x="1" y="1" width="62" height="32" rx="4" fill="#f8d6d2" stroke="#b6463c" stroke-width="2"/><circle cx="10" cy="17" r="5" fill="#eeaaa2"/><text x="37" y="23" text-anchor="middle" font-size="15" font-weight="700" fill="#85261e">100</text></svg>',
  10:'<svg viewBox="0 0 36 36" class="money coin"><circle cx="18" cy="18" r="16" fill="#e4e8ec" stroke="#7f8b96" stroke-width="2"/><text x="18" y="23.5" text-anchor="middle" font-size="14" font-weight="700" fill="#3c4650">10</text></svg>',
  1:'<svg viewBox="0 0 36 36" class="money coin s"><circle cx="18" cy="18" r="13" fill="#f2dcb8" stroke="#a5763d" stroke-width="2"/><text x="18" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#6d4a1c">1</text></svg>'
};
function moneyRow(c){

function numberLine(k,N,shown,qi){
  const W=480,x0=24,x1=440,step=(x1-x0)/N;let s=`<svg class="nl" viewBox="0 0 ${W} 90" role="img" aria-label="數線">`;

    s+=`<line class="nlt" x1="${x}" y1="24" x2="${x}" y2="44"/>`;
    if(i===qi)s+=`<rect class="qbox" x="${x-22}" y="50" width="44" height="32" rx="6"/><text class="qtxt" x="${x}" y="75" text-anchor="middle">?</text>`;
    else if(shown.includes(i))s+=`<text class="nln" x="${x}" y="76" text-anchor="middle">${i*k}</text>`;
  }

}
function jumpLine(pos,name){
  const W=480,x0=18,x1=462,N=15,step=(x1-x0)/N;let s=`<svg class="nl" viewBox="0 0 ${W} 96" role="img" aria-label="數線">`;
  s+=`<line class="nlx" x1="10" y1="52" x2="${W-4}" y2="52"/>`;
  for(let i=0;i<=N;i++){const x=x0+i*step;s+=`<line class="nlt" x1="${x}" y1="44" x2="${x}" y2="60"/><text class="nln sm" x="${x}" y="82" text-anchor="middle">${i}</text>`;}
  const x=x0+pos*step;
  s+=`<circle class="bug" cx="${x}" cy="30" r="11"/><text class="bugt" x="${x}" y="35" text-anchor="middle">${name[0]}</text><path class="bugp" d="M${x} 41 l-5 -5 h10z"/>`;
  return s+'</svg>';
}
function ruler(len){
  const px=7,cm=Math.min(10,Math.max(3,Math.ceil((len+4)/10))),pad=18,W=cm*10*px+pad*2;
  let s=`<svg class="ruler" viewBox="0 0 ${W} 112" role="img" aria-label="尺">`;
  s+=`<rect class="bar" x="${pad}" y="8" width="${len*px}" height="22" rx="3"/>`;
  s+=`<rect class="rbody" x="4" y="40" width="${W-8}" height="66" rx="5"/>`;
  for(let m=0;m<=cm*10;m++){const x=pad+m*px,h=m%10===0?22:m%5===0?15:9;
    s+=`<line class="rt" x1="${x}" y1="40" x2="${x}" y2="${40+h}"/>`;
    if(m%10===0)s+=`<text class="rn" x="${x}" y="84" text-anchor="middle">${m/10}</text>`;}
  s+=`<text class="ru" x="${W-14}" y="100" text-anchor="end">公分 (cm)</text>`;
  s+=`<line class="guide" x1="${pad}" y1="6" x2="${pad}" y2="40"/><line class="guide" x1="${pad+len*px}" y1="6" x2="${pad+len*px}" y2="40"/>`;
  return s+'</svg>';

function angSVG(deg,l1,l2,rot,mark,cls){
  const r1=rot*Math.PI/180,r2=(rot+deg)*Math.PI/180;
  const p1=[l1*Math.cos(r1),-l1*Math.sin(r1)],p2=[l2*Math.cos(r2),-l2*Math.sin(r2)];
  const xs=[0,p1[0],p2[0]],ys=[0,p1[1],p2[1]];
  const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;
  const ar=Math.min(20,l1*.45,l2*.45),a1=[ar*Math.cos(r1),-ar*Math.sin(r1)],a2=[ar*Math.cos(r2),-ar*Math.sin(r2)];
  const f=n=>n.toFixed(1);
  return `<svg class="ang" viewBox="${f(cx-115)} ${f(cy-115)} 230 230" role="img" aria-label="角">`+
    (mark===false?'':`<path class="wedge" d="M0 0 L${f(a1[0])} ${f(a1[1])} A${f(ar)} ${f(ar)} 0 0 0 ${f(a2[0])} ${f(a2[1])}Z"/>`)+
    `<line class="ray${cls?' '+cls:''}" x1="0" y1="0" x2="${f(p1[0])}" y2="${f(p1[1])}"/><line class="ray${cls?' '+cls:''}" x1="0" y1="0" x2="${f(p2[0])}" y2="${f(p2[1])}"/><circle class="vx" r="4"/></svg>`;
}
function notAngleSVG(kind){

  let body;
  if(kind==='curve'){const m=[(p2[0])/2,(p2[1])/2],n=[-p2[1],p2[0]],k=.35;
    body=`<line class="ray" x1="0" y1="0" x2="${f(p1[0])}" y2="${f(p1[1])}"/><path class="ray" fill="none" d="M0 0 Q${f(m[0]+n[0]*k)} ${f(m[1]+n[1]*k)} ${f(p2[0])} ${f(p2[1])}"/>`;}
  else if(kind==='gap'){const g=22,s2=[g*Math.cos(r2),-g*Math.sin(r2)];
    body=`<line class="ray" x1="0" y1="0" x2="${f(p1[0])}" y2="${f(p1[1])}"/><line class="ray" x1="${f(s2[0])}" y1="${f(s2[1])}" x2="${f(p2[0])}" y2="${f(p2[1])}"/>`;}
  else{const m=[(p1[0])/2,(p1[1])/2],n=[p1[1],-p1[0]],k=.3,m2=[p2[0]/2,p2[1]/2],n2=[-p2[1],p2[0]];

function polySVG(n){
  const rot=R(0,359),pts=[];
  for(let i=0;i<n;i++){const a=(rot+i*360/n+R(-9,9))*Math.PI/180,r=R(72,92);pts.push([r*Math.cos(a),r*Math.sin(a)]);}

const SHAPE={

/* ===== 各章節題庫：B 基礎、S 標準、H 挑戰（對照課本做做看、動動腦、練習） ===== */
function zeroNum(){for(;;){const d=[R(1,9),R(0,9),R(0,9),R(0,9)];for(let k=1;k<4;k++)if(chance(.45))d[k]=0;const n=+d.join('');if(/0/.test(String(n).slice(1)))return n;}}
function readNum(){for(;;){const n=zeroNum();if(zh(n).includes('零'))return n;}}
const seqStr=(a,d,k)=>[...Array(k+1)].map((_,i)=>a+d*i).join(' → ');
function seqQ(cross){
  let step,dir,start,terms;
  for(let g=0;;g++){
    step=pick(cross?[10,100,1000]:[1,10,100,1000]);dir=chance(.6)?1:-1;
    const H=R(10,98);
    if(step===1)start=dir>0?H*100+pick([9,R(0,9)])*10+R(4,8):H*100+R(0,1)*10+R(1,4);
    else if(step===10)start=cross?(dir>0?R(1,9)*1000-R(2,5)*10-R(0,1)*0:R(1,9)*1000+R(2,5)*10):(dir>0?H*100+R(5,8)*10+R(0,9):H*100+R(1,4)*10+R(0,9));
    else if(step===100)start=cross?(dir>0?R(2,9)*1000-R(2,5)*100+R(0,99):R(2,8)*1000+R(1,4)*100+R(0,99)):(dir>0?R(1,8)*1000+R(5,8)*100+R(0,99):R(2,9)*1000+R(1,4)*100+R(0,99));
    else start=dir>0?R(1000,3999):R(7000,9999);
    terms=[...Array(8)].map((_,i)=>start+dir*step*i);
    if(Math.min(...terms)>=1000&&Math.max(...terms)<=10000)break;
  }
  const nb=cross?3:2;let pos=shuffle([0,1,2,3,4,5,6,7]).slice(0,nb).sort((a,b)=>a-b);
  if(cross&&!pos.includes(0)&&chance(.5))pos=[0,...pos.slice(1)].sort((a,b)=>a-b);
  let html='按照順序填填看。<div class="seq">';let bi=0;
  html+=terms.map((v,i)=>pos.includes(i)?`{${bi++}}`:`<span>${v}</span>`).join('<i>→</i>')+'</div>';
  return F(html,pos.map(i=>terms[i]),`先看相鄰兩個數，每次${dir>0?'多':'少'} ${step}：${terms.join(' → ')}。${step>=10?'注意滿 10 要進位、不夠要退位！':''}`);
}
const S11={
  B:[
    ()=>{const n=readNum(),s=String(n);return F(`「${zh(n)}」用數字記成 {0}。`,n,`千位 ${s[0]}、百位 ${s[1]}、十位 ${s[2]}、個位 ${s[3]}，記作 <b>${n}</b>。讀到「零」表示中間那一位是 0。`);},
    ()=>{const n=readNum(),s=String(n),cand=new Set(),zz=zh(n);cand.add(zz.replace('零',''));
      for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){const a=s.split('');[a[i],a[j]]=[a[j],a[i]];if(a[0]!=='0'&&a.join('')!==s)cand.add(zh(+a.join('')));}
      const w=[...cand].filter(x=>x!==zz);return C(`${n} 要怎麼讀？`,zz,[w[0],...shuffle(w.slice(1))].slice(0,3),`${n} 讀作「${zz}」。中間有 0 要讀「零」，連續好幾個 0 只讀一個「零」，最後面的 0 不讀。`);},
    ()=>{const n=pick([R(1,9)*1000,R(10,99)*100,R(100,999)*10]);return F(`${n} 的前一個數是 {0}，後一個數是 {1}。`,[n-1,n+1],`前一個數少 1：${n}－1＝<b>${n-1}</b>；後一個數多 1：${n}＋1＝<b>${n+1}</b>。個位不夠減，要向前面借喔！`);}
  ],
  S:[

function angRow(items){return `<div class="angrow">${items.map(([svg,l])=>`<figure>${svg}<figcaption>${l}</figcaption></figure>`).join('')}</div>`;}
/* 疊起來比：所有角的頂點和一條邊對齊（像描圖紙） */
const RC=['r1','r2','r3'];
function gridBG(x0,y0,w,h){const st=23;let g='';const sx=Math.ceil(x0/st)*st,sy=Math.ceil(y0/st)*st;
  for(let x=sx;x<x0+w;x+=st)g+=`<line class="gl" x1="${x}" y1="${y0}" x2="${x}" y2="${y0+h}"/>`;
  for(let y=sy;y<y0+h;y+=st)g+=`<line class="gl" x1="${x0}" y1="${y}" x2="${x0+w}" y2="${y}"/>`;
  return `<rect class="gbg" x="${x0}" y="${y0}" width="${w}" height="${h}"/>`+g;}
const PT=(r,d)=>[r*Math.cos(d*Math.PI/180),-r*Math.sin(d*Math.PI/180)],F1=n=>n.toFixed(1);
function arcNum(r,a0,a1,k,num){const a=PT(r,a0),b=PT(r,a1),t=PT(r+13,(a0+a1)/2);
  return `<path class="arck k${k}" d="M${F1(a[0])} ${F1(a[1])} A${r} ${r} 0 0 0 ${F1(b[0])} ${F1(b[1])}"/><text class="kn k${k}" x="${F1(t[0])}" y="${F1(t[1]+6)}" text-anchor="middle">${num}</text>`;}
/* 課本風格：方格紙、細線、角裡面標弧線和號碼 */
function angFig(deg,l1,l2,rot,k,num){const p1=PT(l1,rot),p2=PT(l2,rot+deg);
  const xs=[0,p1[0],p2[0]],ys=[0,p1[1],p2[1]],cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;const x0=cx-115,y0=cy-115;
  return `<svg class="ang tb" viewBox="${F1(x0)} ${F1(y0)} 230 230" role="img" aria-label="角${num}">${gridBG(x0,y0,230,230)}<line class="kr k${k}" x1="0" y1="0" x2="${F1(p1[0])}" y2="${F1(p1[1])}"/><line class="kr k${k}" x1="0" y1="0" x2="${F1(p2[0])}" y2="${F1(p2[1])}"/>${arcNum(16,rot,rot+deg,k,num)}</svg>`;}

function overlayMulti(list){ // list: [{d,l,lab,num}] 頂點和下面那條邊對齊
  let s='',pts=[[0,0]];const seen={};
  const order=list.map((x,i)=>i).sort((a,b)=>list[b].l-list[a].l);
  order.forEach((i,n)=>{const x=list[i],b=PT(x.l,0);pts.push(b);s+=`<line class="kr k${i+1}${n?' dash':''}" x1="0" y1="0" x2="${F1(b[0])}" y2="${F1(b[1])}"/>`;});
  list.forEach((x,i)=>{const p=PT(x.l,x.d);pts.push(p);const dup=seen[x.d]!=null;seen[x.d]=i;
    s+=`<line class="kr k${i+1}${dup?' dash':''}" x1="0" y1="0" x2="${F1(p[0])}" y2="${F1(p[1])}"/>`;});
  list.forEach((x,i)=>{s+=arcNum(16+i*20,0,x.d,i+1,x.num||String(i+1));});
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;const x0=cx-125,y0=cy-110;
  return `<svg class="ang tb over" viewBox="${F1(x0)} ${F1(y0)} 250 220" role="img" aria-label="疊在一起的角">${gridBG(x0,y0,250,220)}${s}<circle class="vx" r="3"/></svg>`;
}
const trace=svg=>`<details class="trace"><summary>用描圖紙疊起來看看</summary><p class="small">頂點對齊、下面那條邊也對齊，另一條邊在<b>外面</b>的角比較大。</p>${svg}</details>`;

function cmp2(mode){ // mode: 'over' 直接疊好；'side' 分開畫，可以按「疊起來看看」
  let d1,d2;const same=chance(.2);if(same)d1=d2=R(40,125);else for(;;){d1=R(30,145);d2=R(30,145);if(Math.abs(d1-d2)>=20)break;}
  const trick=!same&&chance(.6);let L1,L2;
  if(trick){const lo=R(88,98),sh=R(48,60);if(d1<d2){L1=[lo,lo];L2=[sh,sh];}else{L1=[sh,sh];L2=[lo,lo];}}
  else{L1=[R(65,95),R(65,95)];L2=same?[L1[0]>78?R(50,62):R(88,98),R(60,98)]:[R(65,95),R(65,95)];}
  const ans=same?2:d1>d2?0:1;
  const ov=overlayMulti([{d:d1,l:L1[1],num:'1'},{d:d2,l:L2[1],num:'2'}]);
  const why=(same?'疊起來後，兩個角的邊完全重合，所以<b>一樣大</b>。':`疊起來後，∠${ans+1} 的邊在外面，所以 <b>∠${ans+1} 比較大</b>。`)+(trick?'小心！邊比較長的角不一定比較大。':'')+ov;
  if(mode==='over')return CF('先描下 ∠1（紅色），再和 ∠2（藍色）比：兩個角的頂點對齊、下面那條邊也對齊，疊在一起是下面這樣。哪一個角比較大？',['∠1 比較大','∠2 比較大','一樣大'],ans,why,ov,'sym');
  const r1=R(0,359),r2=R(0,359);
  return CF('∠1 和 ∠2，哪一個角比較大？',['∠1 比較大','∠2 比較大','一樣大'],ans,why,angRow([[angFig(d1,L1[0],L1[1],r1,1,'1'),'∠1'],[angFig(d2,L2[0],L2[1],r2,2,'2'),'∠2']])+trace(ov),'sym');
}
function three(order){let ds;for(;;){ds=[R(25,150),R(25,150),R(25,150)];const s=ds.slice().sort((a,b)=>a-b);if(s[1]-s[0]>=20&&s[2]-s[1]>=20)break;}
  const lab=['ㄅ','ㄆ','ㄇ'],L=ds.map(()=>R(50,98));
  const ov=overlayMulti(ds.map((d,i)=>({d,l:Math.min(L[i],95),num:lab[i]})));
  const row=angRow(ds.map((d,i)=>[angFig(d,L[i],L[i],R(0,359),i+1,lab[i]),'∠'+lab[i]]))+trace(ov);
  if(order){const ord=[0,1,2].sort((a,b)=>ds[b]-ds[a]).map(i=>'∠'+lab[i]).join('＞');
    const perms=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]].map(p=>p.map(i=>'∠'+lab[i]).join('＞')).filter(x=>x!==ord);
    return C('把三個角由大到小排排看。',ord,shuffle(perms).slice(0,3),`疊起來看，邊在最外面的最大：<b>${ord}</b>。`+ov,row);}
  const big=chance(.5),k=ds.indexOf(big?Math.max(...ds):Math.min(...ds));
  return CF(`哪一個角最${big?'大':'小'}？`,lab.map(l=>'∠'+l),k,`疊起來看，張開得最${big?'大':'小'}的是 <b>∠${lab[k]}</b>。角的大小和邊的長短、開口方向都沒有關係。`+ov,row,'sym');}

/* ===== 注音字型的破音字處理：用 IVS（U+E01E0 起）選讀音 ===== */
const BP_DEFAULT={'個':1,'和':1,'得':1,'子':1,'相':1,'轉':1,'當':1};
const BP_RULES=[ // [詞, 目標字在詞中的位置, 讀音序號]
  ['個位',0,0],['整個',1,0],['得到',0,0],['獲得',1,0],['轉向',0,0],
  ['中的',0,0],['看了解',1,0],['不倒',1,1],['長高',0,1],['量一量',0,1],['量一量',2,1],['量東',0,1],['尺量',1,1],
  ['右數',1,1],['億載',1,1],['題目的',2,0],['拿得到',1,1]
];
function bpAnnotate(s){
  if(!/[一-鿿]/.test(s))return s;
  const res={},chars=[...s];
  const isC=c=>c&&/[一-鿿]/.test(c);
  // 跳過已經處理過的字（後面已有 IVS）
  const hasVS=i=>chars[i+1]&&chars[i+1].codePointAt(0)>=0xE0100;
  chars.forEach((c,i)=>{
    if(!BP.R[c]||c==='一'||c==='不'||hasVS(i))return;
    let best=null;
    (BP.DB[c]||[]).forEach(([ri,pats])=>pats.forEach(p=>{const L=p.split('*').join(c);
      for(let j=0;j<p.length;j++){if(p[j]!=='*')continue;const st=i-j;if(st>=0&&chars.slice(st,st+L.length).join('')===L&&(!best||L.length>best[1]))best=[ri,L.length];}}));
    res[i]=best?best[0]:(BP_DEFAULT[c]||0);
  });
  const str=chars.join('');
  BP_RULES.forEach(([ph,off,ri])=>{let k=-1;while((k=str.indexOf(ph,k+1))>=0){
    // 字串位置轉成 chars 索引
    const ci=[...str.slice(0,k)].length+off;if(chars[ci]===[...ph][off]&&!hasVS(ci))res[ci]=ri;}});
  const toneOf=i=>{const c=chars[i];if(!BP.T[c])return 0;const ri=res[i]||0;let t=+BP.T[c][ri];if(t===5)t=+BP.T[c][0];return t;};
  chars.forEach((c,i)=>{
    if((c!=='一'&&c!=='不')||hasVS(i))return;
    const nx=chars[i+1],pv=chars[i-1];
    if(c==='一'){
      if(!isC(nx)||'第十初統唯單'.includes(pv||'#')||nx==='一'||(pv&&pv===nx)){res[i]=0;return;}
      res[i]=toneOf(i+1)===4?1:2;
    }else{
      if(!isC(nx)||(pv&&pv===nx)){res[i]=0;return;}
      res[i]=toneOf(i+1)===4?1:0;
    }
  });
  return chars.map((c,i)=>res[i]>0?c+String.fromCodePoint(0xE01E0+res[i]):c).join('');
}
/* 畫面上的文字一出現就自動加上正確讀音 */
function bpWalk(root){
  if(root.nodeType===3){bpNode(root);return;}
  if(root.nodeType!==1||root.closest('svg,script,style,textarea'))return;
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&n.parentElement.closest('svg,script,style,textarea')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const list=[];while(tw.nextNode())list.push(tw.currentNode);list.forEach(bpNode);
}
function bpNode(n){const p=n.parentElement;if(!p||p.closest('svg,script,style,textarea'))return;const a=bpAnnotate(n.data);if(a!==n.data)n.data=a;}
if(typeof document!=='undefined'&&typeof MutationObserver!=='undefined'){
  new MutationObserver(ms=>ms.forEach(m=>{if(m.type==='characterData')bpNode(m.target);else m.addedNodes.forEach(bpWalk);})).observe(document.body,{childList:true,subtree:true,characterData:true});
}

/* 音效 */
let actx;
function tone(notes,type){if(!S.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;
  notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t+i*.09);g.gain.exponentialRampToValueAtTime(.16,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+i*.09+.22);o.connect(g).connect(actx.destination);o.start(t+i*.09);o.stop(t+i*.09+.25);});}catch(e){}}
const beep=ok=>tone(ok?[660,880,1320]:[300,220],ok?'triangle':'sine');

/* 彩帶 */
const fx=$('#fx'),fxc=fx.getContext('2d');let parts=[],fxOn=false;
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(x,y,n){if(reduce)return;const cs=getComputedStyle(document.documentElement);const cols=['--u1','--u2','--u3','--u4','--u5','--sun'].map(v=>cs.getPropertyValue(v).trim());
  fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*7;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,r:Math.random()*6,c:cols[i%cols.length],w:5+Math.random()*5,life:70+Math.random()*40});}
  if(!fxOn){fxOn=true;requestAnimationFrame(tick);}}
function tick(){const d=devicePixelRatio;fxc.clearRect(0,0,fx.width,fx.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.99;p.r+=.15;p.life--;fxc.save();fxc.translate(p.x*d,p.y*d);fxc.rotate(p.r);fxc.fillStyle=p.c;fxc.fillRect(-p.w*d/2,-p.w*d/4,p.w*d,p.w*d/2);fxc.restore();});
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);if(parts.length)requestAnimationFrame(tick);else{fxOn=false;fxc.clearRect(0,0,fx.width,fx.height);}}

let toastQ=[],toastOn=false;
function toast(html){toastQ.push(html);if(!toastOn)nextToast();}
function nextToast(){const h=toastQ.shift();if(!h){toastOn=false;return;}toastOn=true;const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.innerHTML=h;document.body.appendChild(t);
  setTimeout(()=>t.classList.add('out'),2600);setTimeout(()=>{t.remove();nextToast();},3000);}
function checkBadges(){
  BADGES.forEach(b=>{if(S.badges[b.id])return;const [c,m]=b.p(S);if(c>=m){S.badges[b.id]=Date.now();S.tokens+=10;
    let extra='';if(b.fig&&!S.figs[b.fig]){S.figs[b.fig]=1;extra=`<br>還得到限定公仔「${FIG[b.fig].name}」！`;}
    toast(`<div class="tb">${badgeSVG(b,true)}</div><div><b>獲得徽章：${b.name}</b><span>+10 代幣${extra}</span></div>`);tone([523,659,784,1047],'triangle');}});

  save();
}

/* ---------- 出題 ---------- */
function makeQs(list){const seen=new Set(),out=[];
  list.forEach(([id,tier])=>{let q;for(let k=0;k<40;k++){q=genTier(SEC[id].pool,tier);const key=q.html+'|'+q.ans;if(!seen.has(key)){seen.add(key);break;}}q.sec=id;out.push(q);});return out;}
function startSec(id){const s=SEC[id];run({mode:'sec',id,title:`<span class="code">${id}</span> ${s.name}`,u:s.u,qs:makeQs(['B','B','S','S','S','S','H','H'].map(t=>[id,t]))});}
function startUnit(u){const ids=UNIT_SECS(u);const list=[];for(let i=0;i<10;i++)list.push([ids[i%ids.length],i<6?'S':'H']);
  run({mode:'unit',id:'u'+u,title:`第 ${u} 單元大挑戰`,u,qs:shuffle(makeQs(list))});}
function startAll(){const ids=shuffle(Object.keys(SEC)).slice(0,15).sort();const tiers=shuffle([...Array(9).fill('S'),...Array(6).fill('H')]);
  run({mode:'all',id:'all',title:'期中總複習',u:2,qs:makeQs(ids.map((id,i)=>[id,tiers[i]]))});}

/* ---------- 作答 ---------- */
let G=null;
function run(g){G={...g,i:0,score:0,combo:0,res:[],earned:0,starsBefore:g.mode==='sec'?(S.stars[g.id]||0):0};closeSheet();showQ();}
function showQ(){
  const q=G.qs[G.i],n=G.qs.filter(x=>!x.retry).length,s=SEC[q.sec];G.qStart=Date.now();const qn=G.qs.slice(0,G.i+1).filter(x=>!x.retry).length;
  let body=q.html;
  if(q.kind==='fill')body=body.replace(/\{(\d)\}/g,(_,i)=>`<input class="blank" id="b${i}" data-i="${i}" inputmode="none" autocomplete="off" maxlength="5" aria-label="第 ${+i+1} 格答案">`);

    <div class="dots">${G.qs.map((x,k)=>`<i class="${x.retry?'rt ':''}${k<G.i?(G.res[k]?'ok':'no'):k===G.i?'cur':''}"></i>`).join('')}</div></div>
    <div class="qcard" id="qc">
      <div class="qno"><span>${q.retry?'<em class="chip retry">訂正：類似題</em> 剛剛那題的同類型題目':`第 ${qn} 題 / 共 ${n} 題 ${q.hard?'<em class="chip hard">挑戰題</em>':q.tier==='B'?'<em class="chip">基礎</em>':''}`}</span><span>${G.mode==='sec'?'':s.id+' '+s.name}</span></div>
      <div class="qtext">${body}</div>
      ${q.kind==='choice'?`<div class="opts ${q.cls||''}">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div>`:
        `<div class="hint" id="hint" aria-live="polite"></div><div class="keypad" id="kp">${[1,2,3,'del',4,5,6,'nx',7,8,9,'ok',0].map(d=>d==='del'?'<button class="fn" data-d="del" aria-label="刪除">⌫</button>':d==='nx'?(q.ans.length>1?'<button class="fn" data-d="nx">下一格</button>':'<button class="fn" data-d="clr">清除</button>'):d==='ok'?'<button class="send" data-d="ok">送出</button>':`<button data-d="${d}"${d===0?' class="zero"':''}>${d}</button>`).join('')}</div>`}
      <div id="fbx"></div>
    </div></div>`;
  $('#back').onclick=()=>home();
  if(q.kind==='choice')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answerChoice(+b.dataset.k,b));
  else setupFill(q);
  window.scrollTo(0,0);

let act=0;
function setupFill(q){
  const ins=[...app.querySelectorAll('.blank')];act=0;
  const setAct=i=>{act=i;ins.forEach((x,k)=>x.classList.toggle('act',k===i));};
  ins.forEach((x,k)=>{x.addEventListener('focus',()=>setAct(k));x.addEventListener('click',()=>setAct(k));
    x.addEventListener('input',()=>{x.value=x.value.replace(/\D/g,'').slice(0,5);});
    x.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitFill();}});});
  setAct(0);if(matchMedia('(pointer:fine)').matches)ins[0].focus({preventScroll:true});
  $('#kp').onclick=e=>{const b=e.target.closest('button');if(!b||$('#qc').dataset.done)return;const d=b.dataset.d,x=ins[act];
    if(d==='ok')return submitFill();
    if(d==='nx'){setAct((act+1)%ins.length);return;}
    if(d==='del'){x.value=x.value.slice(0,-1);return;}
    if(d==='clr'){x.value='';return;}
    if(x.value.length<5)x.value+=d;$('#hint').textContent='';
    if(x.value.length>=String(q.ans[act]).length&&act<ins.length-1&&String(q.ans[act]).length>=1&&x.value.length>=5)setAct(act+1);};
}
function submitFill(){
  const qc=$('#qc');if(qc.dataset.done)return;const q=G.qs[G.i];const ins=[...app.querySelectorAll('.blank')];
  if(ins.some(x=>x.value==='')){$('#hint').textContent='還有空格沒有填喔！';qc.classList.remove('shake');void qc.offsetWidth;qc.classList.add('shake');const e=ins.findIndex(x=>x.value==='');ins[e].click();return;}
  const okEach=ins.map((x,k)=>+x.value===q.ans[k]);const ok=okEach.every(Boolean);
  ins.forEach((x,k)=>{x.classList.remove('act');x.classList.add(okEach[k]?'ok':'no');x.readOnly=true;});
  $('#kp').hidden=true;$('#hint').textContent='';
  finish(ok,q.ans.join('、'),qc.querySelector('.qtext'));
}
function answerChoice(k,btn){
  const qc=$('#qc');if(qc.dataset.done)return;const q=G.qs[G.i];const ok=k===q.ans;
  app.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===q.ans)b.classList.add('ok');else if(j===k)b.classList.add('no');else b.classList.add('dim');});
  finish(ok,q.opts[q.ans],btn);
}
function finish(ok,right,el){
  const qc=$('#qc');qc.dataset.done='1';const q=G.qs[G.i];
  G.res[G.i]=ok;let gain=0;S.playMs+=Math.min(Date.now()-(G.qStart||Date.now()),180000);
  if(ok){if(!q.retry)G.score++;G.combo++;S.st.correct++;if(q.hard)S.st.hard++;
    gain=q.retry?1:G.mode==='wrong'?3:(q.hard?4:2);if(G.combo>=3&&!q.retry)gain++;
    if(G.mode==='wrong'){S.st.fixed++;}
    S.st.maxCombo=Math.max(S.st.maxCombo,G.combo);}
  else G.combo=0;
  const key=q.html+'|'+q.ans;
  let addedRetry=false,autoAsk=false;
  if(!ok&&G.mode!=='wrong'&&!q.retry){let r;for(let k=0;k<15;k++){r=genTier(SEC[q.sec].pool,q.tier||'S');if(r.html!==q.html)break;}r.sec=q.sec;r.retry=true;G.qs.splice(G.i+1,0,r);addedRetry=true;}
  if(!ok&&q.retry){autoAsk=addAsk(q);}
  if(!ok&&!q.retry&&G.mode!=='wrong'){S.wrong=S.wrong.filter(w=>w.html+'|'+w.ans!==key);S.wrong.unshift(q);S.wrong=S.wrong.slice(0,40);}
  if(ok&&G.mode==='wrong')S.wrong=S.wrong.filter(w=>w.html+'|'+w.ans!==key);
  G.earned+=gain;if(gain)addTokens(gain);else save();
  checkBadges();
  beep(ok);
  if(ok){const r=el.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2,G.combo>=3?70:36);}
  const c=$('#combo');if(G.combo>=2){c.hidden=false;c.textContent=`連對 ${G.combo}`;}else c.hidden=true;
  $('#fbx').innerHTML=`<div class="fb ${ok?'ok':'no'}" aria-live="polite">
    <h3>${ok?(q.retry?'訂正成功！你學會了':pick(PRAISE)):pick(OOPS)}${ok?`<span class="gain">${coin} +${gain}</span>`:` <span class="right">正確答案：<b>${q.cls==='shape'?'綠色框的圖形':right}</b></span>`}</h3>
    ${ok?`<details class="explain"${q.hard||q.retry?' open':''}><summary>看解說：確認自己是這樣算的</summary>${q.explain}</details>`:`<p class="howto">先把下面的解說<b>一步一步看懂</b>，想想自己哪裡算錯了。</p><div class="explain">${q.explain}</div>`}
    ${autoAsk?`<div class="askbox">這類題目還不太懂，沒關係！已經幫你記在「要問的題目」裡，記得找老師或爸爸媽媽一起看。</div>`:''}
    ${!ok&&!autoAsk?`<button class="btn askbtn" id="askq">還是看不懂？記下來問老師／爸媽</button>`:''}
    <button class="btn go next" id="nextb">${addedRetry?'我看懂了，做一題類似的 →':G.i+1<G.qs.length?'下一題 →':'看結果'}</button></div>`;
  const nb=$('#nextb');nb.onclick=next;nb.focus({preventScroll:true});
  const aq=$('#askq');if(aq)aq.onclick=()=>{addAsk(q);aq.disabled=true;aq.textContent='已記下來了，記得去問喔！';};
  $('#fbx').scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'});
}
function next(){G.i++;if(G.i<G.qs.length)showQ();else result();}
document.addEventListener('keydown',e=>{
  if(!G||!$('#qc'))return;
  if($('#qc').dataset.done&&e.key==='Enter'&&document.activeElement?.id!=='nextb'){e.preventDefault();next();return;}
  const q=G.qs[G.i];if(!q||$('#qc').dataset.done)return;
  if(q.kind==='choice'){const n=parseInt(e.key,10);if(n>=1&&n<=q.opts.length){answerChoice(n-1,app.querySelectorAll('.opt')[n-1]);}}
  else if(!document.activeElement?.classList?.contains('blank')){
    const ins=[...app.querySelectorAll('.blank')];const x=ins[act];if(!x)return;
    if(/^\d$/.test(e.key)&&x.value.length<5){x.value+=e.key;}else if(e.key==='Backspace'){x.value=x.value.slice(0,-1);}else if(e.key==='Enter'){submitFill();}
  }
});
function addAsk(q){const key=q.html+'|'+q.ans;if(S.ask.some(x=>x.html+'|'+x.ans===key))return true;S.ask.unshift({...q});S.ask=S.ask.slice(0,30);save();return true;}
function askList(){
  const view=q=>{let h=q.html.replace(/\{(\d)\}/g,'<span class="pblank">（　）</span>');h=h.includes('@V@')?h.replace('@V@',`<div class="visual">${q.visual}</div>`):h+(q.visual?`<div class="visual">${q.visual}</div>`:'');return h;};
  app.innerHTML=`<div class="wrap">
    <div class="qtop"><button class="iconbtn" id="back">← 回地圖</button><h2>要問的題目</h2></div>
    <p class="muted">把這些題目拿給老師或爸爸媽媽，一起看解說、一起算一次。弄懂了再按「我懂了」。</p>
    <div class="asks">${S.ask.map((q,i)=>`<article class="askcard" style="--uc:${ucol(SEC[q.sec].u)}"><div class="qno"><span><b class="code">${q.sec}</b> ${SEC[q.sec].name}</span></div><div class="qtext sm">${view(q)}</div>
      ${q.kind==='choice'?`<div class="opts ${q.cls||''}">${q.opts.map((o,k)=>`<div class="opt${k===q.ans?' ok':''}">${o}</div>`).join('')}</div>`:`<p><b>答案：</b><span class="num big">${q.ans.join('、')}</span></p>`}
      <div class="explain">${q.explain}</div><button class="btn go" data-i="${i}">我懂了，移除這題</button></article>`).join('')||'<p>都問完了，太棒了！</p>'}</div></div>`;
  $('#back').onclick=home;app.querySelectorAll('.askcard .btn').forEach(b=>b.onclick=()=>{S.ask.splice(+b.dataset.i,1);save();S.ask.length?askList():home();});
  window.scrollTo(0,0);
}
function restBreak(){
  const ov=document.createElement('div');ov.className='reveal-bg';ov.id='rest';let t=20;
  ov.innerHTML=`<div class="reveal rest" role="dialog" aria-modal="true" aria-label="眼睛休息時間"><svg viewBox="0 0 120 70" class="eye" aria-hidden="true"><path d="M8 35 Q60 -8 112 35 Q60 78 8 35Z" fill="#fff" stroke="#2b2a33" stroke-width="4"/><circle cx="60" cy="35" r="17" fill="#5aa8ef" stroke="#2b2a33" stroke-width="3"/><circle cx="60" cy="35" r="8" fill="#2b2a33"/><circle cx="65" cy="30" r="3.5" fill="#fff"/></svg>
    <h3>眼睛休息時間</h3><p>已經複習 15 分鐘了！<br>看看窗外遠方的東西，眨眨眼，再站起來動一動。</p><div class="cd num" id="cd">20</div>
    <button class="btn go" id="restok" disabled>休息 20 秒後才能繼續</button></div>`;
  document.body.appendChild(ov);
  const iv=setInterval(()=>{t--;const c=$('#cd');if(c)c.textContent=t;if(t<=0){clearInterval(iv);const b=$('#restok');b.disabled=false;b.textContent='休息好了，繼續';b.focus();}},1000);
  $('#restok').onclick=()=>{ov.remove();};
}
function result(){
  const orig=G.qs.map((q,k)=>[q,k]).filter(([q])=>!q.retry),n=orig.length,sc=G.score,p=sc/n;
  const rts=G.qs.map((q,k)=>[q,k]).filter(([q])=>q.retry),rtOk=rts.filter(([,k])=>G.res[k]).length;const st=p>=.85?3:p>=.6?2:p>=.4?1:0;
  S.st.quizzes++;if(sc===n&&G.mode!=='wrong')S.st.perfect++;
  let msg,bonus=0;
  if(G.mode==='sec'){const prev=S.stars[G.id]||0;if(st>prev){bonus=(st-prev)*3;S.stars[G.id]=st;}
    msg=st===3?'滿分級表現！這一關你已經學會了。':st===2?'很不錯！再挑戰一次拿滿三顆星吧。':st===1?'先看重點小卡，再試一次。':'沒關係，先複習重點，再慢慢來。';}
  else if(G.mode==='unit'||G.mode==='all'){
    if(G.mode==='unit'&&(S.best[G.id]==null||sc>S.best[G.id]))S.best[G.id]=sc;
    if(G.mode==='all')S.st.allBest=Math.max(S.st.allBest,sc);
    if(p>=.8)bonus=5;
    msg=p>=.85?'超強！考試一定沒問題。':p>=.6?'很好！把錯的題目再練一次會更穩。':'先回到章節慢慢練習，會越來越熟。';}
  else msg=S.wrong.length?`錯題本還剩 ${S.wrong.length} 題，加油！`:'錯題全部清光了！';
  if(bonus)S.tokens+=bonus;G.earned+=bonus;save();
  const g=G;const wrongs=orig.filter(([,k])=>!g.res[k]).length;
  app.innerHTML=`<div class="wrap" style="--uc:${ucol(g.u)}"><div class="result">
    <h2>${g.title}</h2>
    ${g.mode==='sec'?`<div class="bigstars">${[0,1,2].map(i=>`<i class="${i<st?'on':''}">★</i>`).join('')}</div>`:''}
    <div class="score">${sc}<small> / ${n} 題答對</small></div>
    <div class="earn">${coin} 這一回合得到 <b>${g.earned}</b> 代幣${bonus?`（含${g.mode==='sec'?'新星星':'高分'}獎勵 ${bonus}）`:''}・現在共有 <b class="tokn">${S.tokens}</b></div>
    ${rts.length?`<p class="rtline">訂正類似題：答對 <b>${rtOk}</b> / ${rts.length} 題${rtOk<rts.length?'。還不懂的題目已經記在「要問的題目」，記得去問喔！':'，每一題都會算了！'}</p>`:''}
    <p>${msg}</p>
    <div class="row"><button class="btn" id="home">回地圖</button><button class="btn go" id="again">${g.mode==='wrong'?'繼續練錯題':'再挑戰一次'}</button>
    ${canSpin()===true?`<button class="btn gacha-go" id="togacha">去轉扭蛋</button>`:''}
    ${wrongs&&g.mode!=='wrong'?`<button class="btn" id="wr">練習剛剛的錯題（${wrongs}）</button>`:''}</div></div></div>`;
  $('#home').onclick=home;
  $('#again').onclick=()=>{if(g.mode==='sec')startSec(g.id);else if(g.mode==='unit')startUnit(g.u);else if(g.mode==='all')startAll();else{S.wrong.length?startWrong():home();}};
  if($('#wr'))$('#wr').onclick=()=>{const qs=g.qs.filter((q,k)=>!q.retry&&!g.res[k]).map(q=>({...q}));run({mode:'wrong',id:'wrong',title:'錯題再練一次',u:g.u,qs});};
  if($('#togacha'))$('#togacha').onclick=()=>gacha(g.u);
  if(st===3||(g.mode!=='sec'&&p>=.85))setTimeout(()=>confetti(innerWidth/2,innerHeight/3,140),250);
  G=null;checkBadges();window.scrollTo(0,0);
  if(S.playMs>=REST_MS){S.playMs=0;save();setTimeout(restBreak,reduce?0:900);}
}

/* ---------- 扭蛋機 ---------- */
let curM=1;
function poolOf(u){const all=FIGS.filter(f=>f.u===u);const full=UNIT_SECS(u).every(id=>(S.stars[id]||0)===3);return all.filter(f=>f.r!=='SR'||full);}
function gacha(u){
  if(u)curM=u;else{const open=MACHINES.find(m=>unitStars(m.u)>=UNLOCK);curM=curM&&unitStars(curM)>=UNLOCK?curM:(open?open.u:1);}
  const m=MACHINES.find(x=>x.u===curM),us=unitStars(curM),open=us>=UNLOCK,pool=poolOf(curM),all=FIGS.filter(f=>f.u===curM);
  const srOpen=pool.some(f=>f.r==='SR');
  app.innerHTML=`<div class="wrap" style="--uc:${ucol(curM)}">
    <div class="qtop"><button class="iconbtn" id="back">← 回地圖</button><h2>扭蛋機</h2>${topTools()}</div>
    <div class="mtabs" role="tablist">${MACHINES.map(x=>{const o=unitStars(x.u)>=UNLOCK;return `<button role="tab" aria-selected="${x.u===curM}" class="mtab${x.u===curM?' on':''}" data-u="${x.u}" style="--uc:${ucol(x.u)}"><b>${x.u}</b><span>${x.name.replace('扭蛋機','')}</span>${o?'':'<i>未開放</i>'}</button>`;}).join('')}</div>
    <div class="gstage">
      <div class="gmach ${open?'':'locked'}" id="gm">${machineSVG(curM)}${open?'':`<div class="lock">第 ${curM} 單元拿到 ${UNLOCK} 顆星就開放<br><b>目前 ${us} / ${UNLOCK} 顆</b></div>`}</div>
      <div class="ginfo">
        <h3>${m.name}</h3>
        <p class="muted">轉一次 ${COST} 代幣。抽到重複的公仔，會換回 6 代幣。<br>代幣要靠「答對題目」得到，先學會最重要！</p>
        <div class="gpool">${all.map(f=>{const have=S.figs[f.id],avail=pool.includes(f);return `<div class="gp ${RAR[f.r].cls}${avail?'':' na'}" title="${have?f.name:'？？？'}">${figSVG(f,!have)}<span>${have?f.name:(avail?'？？？':'未出現')}</span><em>${RAR[f.r].name}</em></div>`;}).join('')}</div>
        <p class="muted small">${srOpen?'超稀有公仔已經出現在這台扭蛋機裡了！':`超稀有公仔：第 ${curM} 單元每個章節都拿到 3 顆星後才會出現。`}</p>
        <button class="btn go spin" id="spin" ${canSpin(curM)===true?'':'disabled'}>${canSpin(curM)===true?`轉一次（${COST} 代幣）`:canSpin(curM)}</button>
      </div>
    </div></div>`;
  $('#back').onclick=home;bindTools(()=>gacha(curM));
  app.querySelectorAll('.mtab').forEach(b=>b.onclick=()=>gacha(+b.dataset.u));
  const sp=$('#spin');if(sp)sp.onclick=()=>spin(curM);
  window.scrollTo(0,0);
}
function canSpin(u){if(S.day.d!==today())S.day={d:today(),n:0};if(S.wrong.length>=5)return `錯題本還有 ${S.wrong.length} 題，先訂正到 4 題以下才能轉`;if(S.tokens<COST)return `代幣不夠（還差 ${COST-S.tokens}）`;if(u&&unitStars(u)<UNLOCK)return '還沒開放';return true;}
function rollFig(u){const pool=poolOf(u);const w={N:22,R:24,SR:10};let tot=pool.reduce((a,f)=>a+w[f.r],0),r=Math.random()*tot;for(const f of pool){r-=w[f.r];if(r<0)return f;}return pool[0];}
function spin(u){
  if(canSpin(u)!==true)return;const sp=$('#spin');sp.disabled=true;
  S.tokens-=COST;S.st.pulls++;S.day.n++;const f=rollFig(u);const dup=!!S.figs[f.id];S.figs[f.id]=(S.figs[f.id]||0)+1;if(dup)S.tokens+=6;save();
  document.querySelectorAll('.tokn').forEach(e=>e.textContent=S.tokens);
  const gm=$('#gm');gm.classList.add('turning');tone([392,440,494,523],'square');
  setTimeout(()=>reveal(f,dup,u),reduce?50:1300);
}
function reveal(f,dup,u){
  const ov=document.createElement('div');ov.className='reveal-bg';ov.id='rv';
  ov.innerHTML=`<div class="reveal ${RAR[f.r].cls}" role="dialog" aria-modal="true" aria-label="抽到的公仔">
    <div class="capsule"><span class="ctop"></span><span class="cbot"></span></div>
    <div class="rfig">${figSVG(f,false)}</div>
    <div class="rtxt"><em class="rar">${RAR[f.r].name}</em><h3>${f.name}</h3><p>${f.d}</p><p class="${dup?'dup':'newf'}">${dup?`已經有了，換回 6 代幣（共有 ${S.figs[f.id]} 個）`:'NEW！新公仔加入收藏冊'}</p></div>
    <div class="row"><button class="btn" id="rvc">收進收藏冊</button>${canSpin(u)===true?`<button class="btn go" id="rva">再轉一次</button>`:''}</div></div>`;
  document.body.appendChild(ov);
  tone(f.r==='SR'?[523,659,784,1047,1319]:f.r==='R'?[523,659,784,1047]:[523,659,784],'triangle');
  setTimeout(()=>confetti(innerWidth/2,innerHeight/2.6,f.r==='N'?50:120),reduce?0:700);
  const close=()=>{ov.remove();checkBadges();gacha(u);};
  $('#rvc').onclick=close;if($('#rva'))$('#rva').onclick=()=>{ov.remove();checkBadges();gacha(u);setTimeout(()=>spin(u),50);};
  $('#rvc').focus();
}


/* ---------- 說明頁 ---------- */
function intro(){
  closeSheet();G=null;
  app.innerHTML=`<div class="wrap intro">
  <header class="ihead"><small>國小數學 三年級上學期・期中複習</small><h1>期中<em>闖關</em>大冒險</h1><p>範圍：第 1 單元「10000以內的數」到 5-2「角的大小比較」，共 16 個章節。</p></header>
  <div class="icols">
    <section class="ibox kid">
      <h2>小朋友，這樣玩</h2>
      <ol class="isteps">
        <li><b>選一個章節</b>先看「重點小卡」，再開始 8 題闖關：基礎 2 題、標準 4 題、挑戰 2 題。</li>
        <li><b>答錯沒關係</b>：先把解說一步一步看懂，再做一題類似的「訂正題」。</li>
        <li><b>看不懂就問</b>：按「記下來問老師／爸媽」，再去問老師或爸爸媽媽。</li>
        <li><b>眼睛要休息</b>：每 15 分鐘會提醒你看看遠方、休息 20 秒。</li>
        <li><b>答對拿代幣</b>：可以轉扭蛋收集公仔、達成目標拿徽章。但是記住，<b>會算才是最重要的！</b></li>
      </ol>
      <div class="promise">我的約定：每一題，我都要知道<b>為什麼</b>這樣算。</div>
    </section>
    <section class="ibox parent">
      <h2>給家長的話：為什麼這樣設計</h2>
      <dl class="why">
        <dt>對照課本，範圍明確</dt><dd>題型依照課本各章節的例題、做做看、動動腦與單元練習設計，只考到 5-2，不超出範圍。</dd>
        <dt>分難度，從會到熟</dt><dd>每關有基礎、標準、挑戰題，先建立信心，再練容易錯的地方，例如中間有 0 的讀法、連續借位、乘法進位、「邊比較長不代表角比較大」等迷思。</dd>
        <dt>重點是「知道怎麼算」</dt><dd>答錯時會顯示直式與每一位的計算步驟，並且要再做一題同類型的訂正題；星星只看原本題目的表現。</dd>
        <dt>不會的地方，留給大人陪伴</dt><dd>訂正後仍答錯的題目會自動放進「要問的題目」，附答案與解說，方便您或老師陪孩子一起看。</dd>
        <dt>獎勵是輔助，不是目的</dt><dd>代幣只能靠答對題目取得；錯題本超過 4 題要先訂正才能轉扭蛋。公仔和徽章都綁在學習指標上，例如整個單元拿滿星星。</dd>
        <dt>保護眼睛</dt><dd>累計 15 分鐘會提醒休息 20 秒。建議每次使用 20～30 分鐘就好。</dd>
      </dl>
      <p class="note2">題目每次重新產生，可以重複練習。學習紀錄只存在這台裝置的瀏覽器裡，換裝置或清除瀏覽資料會重新開始。</p>
    </section>
  </div>
  <div class="istart"><button class="btn go big" id="go">我準備好了，開始複習 →</button></div>
  </div>`;
  $('#go').onclick=home;$('#go').focus({preventScroll:true});window.scrollTo(0,0);
}
/* ---------- 收藏冊 ---------- */
function collection(tab){
  const nf=Object.keys(S.figs).length,nb=Object.keys(S.badges).length;
  const groups=[...MACHINES.map(m=>({t:m.name.replace('扭蛋機',''),u:m.u,list:FIGS.filter(f=>f.u===m.u)})),{t:'限定公仔（達成徽章才拿得到）',u:0,list:FIGS.filter(f=>f.u===0)}];
  app.innerHTML=`<div class="wrap">
    <div class="qtop"><button class="iconbtn" id="back">← 回地圖</button><h2>收藏冊</h2>${topTools()}</div>
    <div class="ctabs" role="tablist"><button role="tab" class="ctab${tab==='fig'?' on':''}" aria-selected="${tab==='fig'}" data-t="fig">公仔圖鑑 ${nf}/${FIGS.length}</button><button role="tab" class="ctab${tab==='badge'?' on':''}" aria-selected="${tab==='badge'}" data-t="badge">徽章牆 ${nb}/${BADGES.length}</button></div>
    ${tab==='fig'?groups.map(g=>`<section class="cgroup" style="--uc:${g.u?ucol(g.u):'var(--accent)'}"><h3>${g.u?`<span class="code">${g.u}</span> `:''}${g.t}</h3><div class="cgrid">${g.list.map(f=>{const have=S.figs[f.id];
      const hint=f.u===0?f.d:f.r==='SR'?`第 ${f.u} 單元全部 3 顆星後出現在扭蛋機`:`第 ${f.u} 單元扭蛋機`;
      return `<div class="ccard ${RAR[f.r].cls}${have?'':' miss'}">${figSVG(f,!have)}<em>${RAR[f.r].name}</em><b>${have?f.name:'？？？'}</b><span>${have?f.d:hint}</span>${have>1?`<i class="cnt">×${have}</i>`:''}</div>`;}).join('')}</div></section>`).join(''):
    `<div class="bgrid">${BADGES.map(b=>{const on=!!S.badges[b.id],[c,m]=b.p(S);return `<div class="bcard${on?' on':''}">${badgeSVG(b,on)}<b>${b.name}</b><span>${b.desc}</span>${on?'<i class="got">已獲得</i>':`<div class="prog" aria-label="進度 ${Math.min(c,m)} / ${m}"><i style="width:${Math.round(Math.min(c,m)/m*100)}%"></i></div><small>${Math.min(c,m)} / ${m}</small>`}</div>`;}).join('')}</div>`}
  </div>`;
  $('#back').onclick=home;bindTools(()=>collection(tab));
  app.querySelectorAll('.ctab').forEach(b=>b.onclick=()=>collection(b.dataset.t));
  window.scrollTo(0,0);
}
checkBadges();intro();

</script>
